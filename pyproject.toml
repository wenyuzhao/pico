[project]
name = "pixie"
version = "0.1.0"
description = "Tiny experimental LLM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "duckdb>=1.3.2",
    "lion-pytorch>=0.2.3",
    "pandas>=2.3.1",
    "pyarrow>=21.0.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "python-slugify>=8.0.4",
    "pytorch-warmup>=0.2.0",
    "sentencepiece>=0.2.0",
    "simple-parsing>=0.1.7",
    "toml>=0.10.2",
    "torch>=2.7.1",
    "transformers>=4.54.0",
    "typer>=0.19.2",
    "wandb>=0.21.0",
]

[project.scripts]
pixie = "model.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.hatch.build.targets.wheel]
packages = ["scripts", "model"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
