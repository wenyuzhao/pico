[project]
name = "pixie-ai"
version = "0.1.0"
description = "Tiny experimental LLM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "bitsandbytes>=0.48.2",
    "datasets>=4.4.1",
    "duckdb>=1.3.2",
    "lion-pytorch>=0.2.3",
    "onnx>=1.19.1",
    "onnxruntime>=1.23.2",
    "optimum[exporters,onnx]>=2.0.0",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "python-slugify>=8.0.4",
    "pytorch-warmup>=0.2.0",
    "toml>=0.10.2",
    "torch>=2.7.1",
    "transformers>=4.54.0",
    "typer>=0.19.2",
    "wandb>=0.21.0",
]

[project.scripts]
pixie = "pixie.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.hatch.build.targets.wheel]
packages = ["pixie"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["trl<=0.25.1"]

[tool.uv]
package = true
