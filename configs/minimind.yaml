model:
  name: pixie
  tokenizer: jingyaogong/MiniMind2
  hidden_size: 512
  num_hidden_layers: 8
  hidden_act: silu
  num_attention_heads: 8
  num_kv_attention_heads: 2
  dropout: 0.0
  feed_forward_size: 1408
  max_position_embeddings: 32768
  rope_theta: 1000000.0
  generation:
    max_new_tokens: 8192
    temperature: 0.7
    top_p: 0.95
    repetition_penalty: 1.15
    do_sample: true
    use_cache: false

train:
  pretrain:
    dataset: datasets/minimind/pretrain_hq.jsonl
    context_length: 512
    batch_size: 64
    epochs: 1
    grad_clip: 1.0
    warmup_steps: 100
    accumulation_steps: 1
    optimizer:
      name: adamw
      learning_rate: 5e-4

  sft:
    dataset: datasets/minimind/sft_mini_512.jsonl
    context_length: 512
    batch_size: 64
    epochs: 2
    grad_clip: 1.0
    warmup_steps: 100
    accumulation_steps: 1
    optimizer:
      name: adamw
      learning_rate: 5e-4

  reason:
    dataset: jingyaogong/minimind_dataset/r1_mix_1024.jsonl
    context_length: 1024
    batch_size: 16
    epochs: 2
    grad_clip: 1.0
    warmup_steps: 100
    accumulation_steps: 1
    optimizer:
      name: adamw
      learning_rate: 5e-4

  dpo:
    dataset: datasets/minimind/dpo.jsonl
    context_length: 1024
    batch_size: 12
    epochs: 2
    grad_clip: 1.0
    warmup_steps: 100
    accumulation_steps: 1
    optimizer:
      name: adamw
      learning_rate: 1.0e-08
