model:
  name: pixie
  tokenizer: microsoft/phi-4
  hidden_size: 512
  num_hidden_layers: 8
  num_attention_heads: 8
  num_kv_attention_heads: 2
  feed_forward_size: 1408

pretrain:
  dataset:
    path: datasets/pile
    limit: 1048576
  context_length: 1024
  batch_size: 4
  epochs: 1
  grad_clip: 1.0
  warmup_steps: 400
  accumulation_steps: 16
  optimizer:
    name: adamw
    learning_rate: 5e-4
