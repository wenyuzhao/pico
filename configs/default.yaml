model:
  name: pico
  tokenizer: configs/tokenizers/lfm2
  hidden_size: 512
  num_hidden_layers: 8
  hidden_act: silu
  num_attention_heads: 8
  num_kv_attention_heads: 2
  dropout: 0.0
  feed_forward_size: 1408
  max_position_embeddings: 32768
  rope_theta: 1000000.0
  rope_scaling:
    type: yarn
    beta_fast: 32.0
    beta_slow: 1.0
    original_max_position_embeddings: 1024
  generation:
    max_length: 4096
    temperature: 0.7
    top_p: 0.95
    repetition_penalty: 1.15
    do_sample: true
    use_cache: true

train:
  pretrain:
    dataset: datasets/fineweb-10bt
    max_length: 1024
    batch_size: 6
    epochs: 1
    grad_clip: 1.0
    warmup_steps: 400
    accumulation_steps: 10
    optimizer:
      name: adamw
      learning_rate: 5e-4

  sft:
    dataset: teknium/OpenHermes-2.5
    max_length: 1024
    batch_size: 6
    epochs: 2
    grad_clip: 1.0
    warmup_steps: 400
    accumulation_steps: 10
    optimizer:
      name: adamw
      learning_rate: 5e-4

  dpo:
    dataset: datasets/magpielm-dpo-data-v0.1
    max_length: 1024
    batch_size: 6
    epochs: 2
    grad_clip: 1.0
    warmup_steps: 400
    accumulation_steps: 15
    optimizer:
      name: adamw
      learning_rate: 1.0e-07
